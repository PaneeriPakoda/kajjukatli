<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy 18th Birthday Anjelina!</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; }
body { font-family: 'Poppins', sans-serif; background: #0d0015; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding-top: 10px; }

.page { display: none; width: 100%; max-width: 480px; height: 100%; overflow-y: auto; }
.page.active { display: block; }

h1 { font-family: 'Dancing Script', cursive; color: #c71585; font-size: 2.4rem; text-align: center; }
.date-badge { display: block; background: #ff1493; color: white; padding: 8px 20px; border-radius: 20px; margin: 15px auto; width: fit-content; }
.content { color: #8b475d; line-height: 1.9; }
.content p { margin-bottom: 16px; }
.signature { font-family: 'Dancing Script', cursive; color: #c71585; text-align: right; margin-top: 25px; font-size: 1.8rem; }
.tulip { text-align: center; font-size: 2.2rem; margin: 15px 0; }
.secrets { display: none; margin-top: 20px; padding: 20px; background: #fff0f5; border-radius: 15px; border: 2px solid #ff69b4; }
.reason { display: flex; align-items: center; padding: 12px; background: white; margin: 10px 0; border-radius: 10px; border-left: 5px solid #ff1493; }

.btn { padding: 14px 28px; border: none; border-radius: 30px; font-size: 1rem; cursor: pointer; margin: 8px; }
.btn-wish { background: #ff69b4; color: white; }
.btn-reveal { background: #ff1493; color: white; }
.btn-end { background: #c71585; color: white; margin-top: 20px; }

.cake-emoji { font-size: 7rem; display: block; animation: float 2s infinite; }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-15px)} }

.scroll { background: #fff0f5; border-radius: 25px; border: 4px solid #ffb6c1; padding: 30px 25px; margin-bottom: 80px; }
.cake-container { background: #fff0f5; border-radius: 25px; border: 4px solid #ffb6c1; padding: 50px 30px; text-align: center; margin-bottom: 30px; }
.cake-hint { background: #fff0f5; padding: 15px; border-radius: 15px; border-left: 5px solid #ff1493; font-style: italic; color: #c71585; }
.welcome-container { background: #fff0f5; border-radius: 25px; border: 5px solid #ffb6c1; padding: 50px 30px; text-align: center; margin-bottom: 30px; }
.balloons { font-size: 4rem; }
.welcome-title { font-family: 'Dancing Script', cursive; color: #c71585; font-size: 2.8rem; }
.welcome-subtitle { color: #8b475d; font-size: 1.2rem; }

.countdown-page { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #1a0a1f, #2d1b33); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
.countdown-title { color: #ffb6c1; font-size: 1.5rem; margin-bottom: 20px; }
.countdown-date { color: #ff69b4; font-size: 1.2rem; margin-bottom: 10px; }
.countdown-timer { font-size: 5rem; font-weight: bold; color: white; font-family: monospace; }
.start-btn { display: none; padding: 25px 60px; font-size: 1.8rem; background: linear-gradient(135deg, #ff1493, #db7093); color: white; border: none; border-radius: 50px; cursor: pointer; margin-top: 30px; }

.bubble-text { display: none; text-align: center; margin-bottom: 20px; }
.bubble-text span { background: linear-gradient(135deg, #ff1493, #ff69b4); color: white; padding: 15px 25px; border-radius: 30px; font-size: 1.6rem; }

.music-btn { position: fixed; bottom: 15px; right: 15px; width: 50px; height: 50px; border-radius: 50%; background: #ff69b4; border: none; color: white; font-size: 1.4rem; cursor: pointer; }
#fireworkCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none; z-index: 50; }

.flower { position: fixed; font-size: 2rem; z-index: 50; animation: fall linear forwards; }
@keyframes fall { 0% { transform: translateY(-10vh); opacity: 1; } 100% { transform: translateY(110vh); opacity: 0; } }
</style>
</head>
<body>

<!-- COUNTDOWN PAGE -->
<div class="countdown-page" id="countdownPage">
    <div class="countdown-title">Wait for the birthday!</div>
    <div class="countdown-date">June 10, 12:00 AM (Midnight)</div>
    <div class="countdown-timer" id="timer">00:00:00</div>
    <div class="bubble-text" id="bubbleText"><span>🎀 HAPPY BIRTHDAY MADAM JI 🌷✨🎀</span></div>
    <button class="start-btn" id="startBtn" onclick="goToPages()">🎁 TAP TO OPEN 🎁</button>
</div>

<audio id="bgMusic" loop>
    <source src="https://www.image2url.com/r2/default/audio/1780887770977-275da719-0688-430d-928b-2d4130912768.mp3" type="audio/mp3">
</audio>

<button class="music-btn" id="musicBtn" onclick="toggleMusic()">🎵</button>

<canvas id="fireworkCanvas"></canvas>

<!-- PAGE 1: Welcome -->
<div class="page active" id="page1">
    <div class="welcome-container">
        <div class="balloons">🎈 🎁 🎉</div>
        <h1 class="welcome-title">Happy 18th Birthday!</h1>
        <p class="welcome-subtitle">Anjelina 🎂</p>
        <button class="btn btn-wish" onclick="goPage2()">Make a Wish! ✨</button>
    </div>
</div>

<!-- PAGE 2: Cake -->
<div class="page" id="page2">
    <div class="cake-container">
        <span class="cake-emoji" id="cake">🎂</span>
        <h1>Make a Wish!</h1>
        <div class="cake-hint">Close your eyes...</div>
        <button class="btn btn-reveal" onclick="blowCandles()">Blow Candles! 🕯️</button>
    </div>
</div>

<!-- PAGE 3: Letter -->
<div class="page" id="page3">
    <div class="scroll">
        <h1>Dear Anjelina 💕</h1>
        <span class="date-badge">June 10, 2026</span>
        <div class="content">
            <p>As the moon glows softly tonight, I wanted to take a moment to celebrate you. You are one of those rare souls who makes the world feel warmer and brighter.</p>
            <p>We've shared so many laughs and created memories I secretly treasure. You have this amazing ability to make even the most ordinary day feel magical.</p>
            <p>On your special day, I wish you all the happiness, love, and adventures this year can hold. You deserve every bit of it and so much more!</p>
            <p>You bring so much joy and light into the world. Your smile, your kindness, your beautiful spirit!</p>
            <p>May this new year of your life be filled with endless happiness, love, and all your dreams coming true!</p>
            <p style="text-align:center;">🎉 <strong>HAPPY 18TH BIRTHDAY!</strong> 🎉</p>
            <p>Today, you step into a beautiful new chapter of your life - you are now officially an adult!</p>
            <p>Thank you for being such an amazing friend.</p>
        </div>
        <div class="tulip">🌷 🌷 🌷</div>
        <p class="signature">Your forever friend,<br>Aratrik 🌷</p>
        <button class="btn btn-wish" onclick="toggleSecrets()">Surprise! 🎁</button>
        <div class="secrets" id="secrets">
            <h2>🎉 Birthday Secrets!</h2>
            <div class="reason"><span>⭐</span><span>You are officially an adult!</span></div>
            <div class="reason"><span>🌟</span><span>Your laughter brightens every day!</span></div>
            <div class="reason"><span>💝</span><span>You deserve all the love!</span></div>
        </div>
        <button class="btn btn-end" onclick="endShow()">The End 🎆</button>
    </div>
</div>

<script>
var music = document.getElementById('bgMusic');
var timerEl = document.getElementById('timer');
var bubbleText = document.getElementById('bubbleText');
var startBtn = document.getElementById('startBtn');
var countdownPage = document.getElementById('countdownPage');
var countdownDone = false;

music.volume = 0.6;

// Target date: June 10, 2026 at Midnight (12:00 AM)
var targetDate = new Date('June 10, 2026 00:00:00').getTime();

function updateTimer() {
    var now = new Date().getTime();
    var diff = targetDate - now;
    
    if (diff <= 0) {
        countdownDone = true;
        timerEl.innerText = "00:00:00";
        bubbleText.style.display = 'block';
        startBtn.style.display = 'block';
        return;
    }
    
    var hours = Math.floor(diff / (1000 * 60 * 60));
    var mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    var secs = Math.floor((diff % (1000 * 60)) / 1000);
    
    timerEl.innerText = 
        (hours < 10 ? "0" + hours : hours) + ":" + 
        (mins < 10 ? "0" + mins : mins) + ":" + 
        (secs < 10 ? "0" + secs : secs);
    
    setTimeout(updateTimer, 1000);
}

updateTimer();
setInterval(createFlower, 300);

function createFlower() {
    var flowers = ['🌷', '🌸', '💗', '✨'];
    var f = document.createElement('div');
    f.className = 'flower';
    f.innerText = flowers[Math.random() * flowers.length | 0];
    f.style.left = Math.random() * 100 + 'vw';
    f.style.animationDuration = (Math.random() * 3 + 4) + 's';
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 5000);
}

function goToPages() {
    if (!countdownDone) return;
    countdownPage.style.display = 'none';
    music.play();
}

function toggleMusic() {
    var btn = document.getElementById('musicBtn');
    if (music.paused) { music.play(); btn.innerHTML = '🎵'; }
    else { music.pause(); btn.innerHTML = '⏸️'; }
}

function goPage2() {
    document.getElementById('page1').classList.remove('active');
    document.getElementById('page2').classList.add('active');
}

function blowCandles() {
    document.getElementById('cake').innerText = '🎉🍰🎉';
    setTimeout(() => {
        document.getElementById('page2').classList.remove('active');
        document.getElementById('page3').classList.add('active');
    }, 500);
}

function toggleSecrets() {
    var s = document.getElementById('secrets');
    s.style.display = s.style.display === 'block' ? 'none' : 'block';
}

function endShow() { 
    var cvs = document.getElementById('fireworkCanvas');
    cvs.style.display = 'block';
    var ctx = cvs.getContext('2d');
    cvs.width = window.innerWidth;
    cvs.height = window.innerHeight;
    var parts = [];
    
    setInterval(() => {
        var x = Math.random() * cvs.width;
        var y = cvs.height * 0.3;
        var color = 'hsl(' + (Math.random() * 360) + ', 100%, 60%)';
        for (var i = 0; i < 50; i++) {
            var a = (Math.PI * 2 / 50) * i;
            parts.push({x: x, y: y, vx: Math.cos(a) * 4, vy: Math.sin(a) * 4, c: color, l: 1});
        }
    }, 600);
    
    function draw() {
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.fillRect(0, 0, cvs.width, cvs.height);
        for (var i = parts.length - 1; i >= 0; i--) {
            var p = parts[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.15;
            p.l -= 0.02;
            if (p.l <= 0) parts.splice(i, 1);
            else { ctx.globalAlpha = p.l; ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2); ctx.fill(); }
        }
        ctx.globalAlpha = 1;
        requestAnimationFrame(draw);
    }
    draw();
}
</script>
</body>
</html>
